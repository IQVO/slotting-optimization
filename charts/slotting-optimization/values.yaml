# Default values for slotting-optimization.

replicaCount: 1

# The image is NEVER pulled from a registry in the local kind cluster: it is
# built from the local checkout and side-loaded with `kind load docker-image`
# (warehouse-infra overrides repository and tag with a content-derived
# local-<hash> tag). `pullPolicy: IfNotPresent` is required there, or the
# kubelet tries to pull from Docker Hub and ImagePullBackOffs. The same image
# carries both binaries: /app/api (this Deployment) and /app/mcp.
image:
  repository: warehouse/slotting-optimization
  pullPolicy: IfNotPresent
  tag: "local"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: slotting-optimization.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Additive, disabled-by-default alternative to the ingress: block above.
# Same shape as every other chart in this fleet. Routes only to this chart's
# main REST API Service -- the same Service ingress.yaml targets.
# warehouse-infra turns it on and supplies the Kong Gateway parentRef + path.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

# Kong plugins rendered by THIS chart (kong-plugins.yaml) and attached to
# every HTTPRoute above via the konghq.com/plugins annotation. Fleet
# decision 2026-10-13: Kong configuration belongs to the application
# charts, not warehouse-infra Terraform. Defaults off; warehouse-infra's
# values switch them on. NO auth plugin here, ever.
kongPlugins:
  cors:
    enabled: false
    origin: "http://localhost"
  prometheus:
    enabled: false
  opentelemetry:
    enabled: false
    tracesEndpoint: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) for the api Deployment, disabled by
# default so nothing changes replica behaviour silently. When enabled, the
# Deployment's replicaCount is omitted so the HPA is the sole owner of
# .spec.replicas. N>1 is safe for the outbox relay (FOR UPDATE SKIP LOCKED),
# the version-guarded aggregate writes (concurrent-modification on conflict)
# and the local-copy consumers (stable consumer groups, dedupe on the
# CloudEvents id in the same transaction); it has not been load-tested. mcp
# deliberately has no block here: the MCP Streamable-HTTP handler keeps
# per-process session state and the mcp Service has no session affinity (see
# mcp: below).
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# deployment.environment.name on every span, metric and log (ENVIRONMENT).
environment: "local"

# Environment read by cmd/api/main.go. Every key maps 1:1 to one env var.
config:
  httpAddr: ":8080"                  # HTTP_ADDR
  logLevel: "info"                   # LOG_LEVEL: debug | info | warn (or warning) | error
  # CORS_ALLOWED_ORIGINS (comma-separated). Empty = not rendered, so the
  # binary's own local-dev default applies. In the kind cluster Kong's global
  # CORS plugin handles browsers; set this only for a direct-to-pod caller.
  corsAllowedOrigins: ""
  # EVENT_PUBLISHER: "log" (default; the outbox drains to the log sink) or
  # "kafka" (relay Slotting events onto warehouse.slotting-optimization.events;
  # requires kafka.enabled=true -- the chart refuses to render otherwise).
  eventPublisher: "log"
  # OUTBOX_RELAY_INTERVAL: Go duration ("500ms", "2s") or plain seconds.
  # Empty = not rendered; the binary defaults to 1s.
  outboxRelayInterval: ""
  # OUTBOX_MAX_ATTEMPTS (gap fix D12, docs/adr/0008): how many times one
  # outbox row may fail before the relay excludes it from claims, so a
  # poison row cannot block the relay forever. The excluded row stays in
  # outbox_events (attempts, last_error) until an operator re-arms it with
  # `UPDATE outbox_events SET attempts = 0 WHERE id = ...`. 0 = unlimited.
  outboxMaxAttempts: 20
  # DEMAND_SITE_ID: the site plans default to; when set, demand for other
  # sites is ignored by the demand consumer. Empty = not rendered, so every
  # request must name its site and every site's demand is ingested. Also
  # rendered into the mcp Deployment (the site its tools default to).
  demandSiteId: ""
  # DEFAULT_SITE_ID: fallback of the default site when DEMAND_SITE_ID is
  # unset (the default site WITHOUT restricting the demand ingested). Empty =
  # not rendered. Also rendered into the mcp Deployment.
  defaultSiteId: ""
  # LOOKBACK_DAYS: default demand window of a new plan, 1..365 (the chart
  # refuses anything else; the binary would silently use 28). Empty/0 = not
  # rendered; the binary defaults to 28.
  lookbackDays: ""
  # FORWARD_ZONE_CODES: comma-separated zone codes of the forward pick slots.
  # Empty = not rendered; the binary defaults to FWD.
  forwardZoneCodes: ""
  # DEMAND_MODE (ADR 0003): "permissive" (default; the demand consumer is not
  # started) or "kafka" (the order-line demand copy, fed from
  # warehouse.order-management.events). "kafka" needs demandConsumerGroup and
  # kafka.enabled=true.
  demandMode: "permissive"
  # DEMAND_CONSUMER_GROUP: the demand consumer's STABLE group id, so a
  # rescheduled pod resumes from its committed offsets. Required when
  # demandMode is "kafka"; setting it in permissive mode is refused (the
  # consumer would silently not start).
  demandConsumerGroup: ""
  # PRODUCT_MODE (ADR 0003): "permissive" (default) or "kafka" (the ABC class
  # and physical profile copy, fed from warehouse.product-master.events).
  productMode: "permissive"
  # PRODUCT_CONSUMER_GROUP: the product consumer's STABLE group id. Required
  # when productMode is "kafka"; refused otherwise.
  productConsumerGroup: ""
  # LAYOUT_MODE (ADR 0003): "permissive" (default) or "kafka" (the forward
  # slot catalogue copy, fed from warehouse.facility.events).
  layoutMode: "permissive"
  # LAYOUT_CONSUMER_GROUP: the layout consumer's STABLE group id. Required
  # when layoutMode is "kafka"; refused otherwise.
  layoutConsumerGroup: ""
  # RELOCATION_MODE (ADR 0010): "permissive" (default; not started) or
  # "kafka" (inventory-storage's StockRelocated on warehouse.inventory.events
  # records the execution progress of the slot plans, shown on
  # GET /slot-plans/{planId} and the MCP get_slot_plan tool). "kafka" needs
  # relocationConsumerGroup and kafka.enabled=true.
  relocationMode: "permissive"
  # RELOCATION_CONSUMER_GROUP: the relocation consumer's STABLE group id.
  # Required when relocationMode is "kafka"; refused otherwise.
  relocationConsumerGroup: ""
  # SHUTDOWN_DRAIN_DELAY: wait after /readyz flips before closing the
  # listener. Empty = not rendered; the binary defaults to 5s.
  shutdownDrainDelay: ""

# The chart refuses to render unless database.url or database.existingSecret
# is set (templates/_helpers.tpl: slotting-optimization.requireDatabase).
database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same existingSecret, of a DIRECT (non-pooled, session-mode)
  # Postgres connection string used ONLY for the golang-migrate startup step
  # (cmd/api and cmd/mcp) -- never for the runtime pgxpool, which always uses
  # existingSecretKey/DATABASE_URL. golang-migrate takes a session-scoped
  # pg_advisory_lock that PgBouncer's transaction pooling cannot honour.
  # `optional: true` on the rendered secretKeyRef so a secret without this key
  # still starts the pod: the binary falls back to DATABASE_URL.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# KAFKA_BROKERS is only set in the api container env when kafka.enabled is
# true. Without it EVENT_PUBLISHER must stay "log" and the local-copy
# consumers cannot run. Produced topic: warehouse.slotting-optimization.events;
# consumed (only in the kafka modes): warehouse.order-management.events,
# warehouse.product-master.events, warehouse.facility.events and
# warehouse.inventory.events (RELOCATION_MODE, ADR 0010).
kafka:
  enabled: false
  brokers: "kafka:9092"

# OpenTelemetry traces + metrics, pushed over OTLP/gRPC to a Collector. The
# endpoint below is the in-cluster Collector Service in the warehouse-infra
# kind cluster. Export is non-blocking, so a Collector that is down costs
# telemetry and nothing else; otel.enabled=false skips the env entirely.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"

# Extra env vars appended to the api container as a raw list.
extraEnv: []

# The Postgres dial (migrations + ping) at boot is wrapped in a bounded retry
# (internal/bootretry: 5 attempts, 1+2+4+8 = 15 s of backoff in total, no
# sleep after the last attempt). periodSeconds * failureThreshold gives a ~60s window
# before the kubelet gives up. Once startupProbe succeeds, liveness takes
# over; readiness uses the separate /readyz endpoint (flipped to not-ready as
# the FIRST step of graceful shutdown).
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Room for the binary's graceful shutdown: SHUTDOWN_DRAIN_DELAY (default 5s)
# + HTTP drain (10s) + consumers drain (10s) + outbox relay drain (10s),
# sequential, worst case ~35s.
terminationGracePeriodSeconds: 40

# --- MCP server (docs/adr/0005) ---
# The Model Context Protocol server (cmd/mcp, Streamable HTTP only, READ-ONLY
# tools). DISABLED by default. Enabling it renders its own Deployment +
# Service (component=mcp) over the same OLTP database, served at "/" and
# "/mcp" with GET /healthz probes, command /app/mcp. Env names in
# templates/mcp-deployment.yaml match cmd/mcp/main.go. It starts no outbox
# relay and dials no Kafka. No auth / API key: MCP servers are
# unauthenticated fleet-wide.
#
# Deliberately NOT HPA-scalable (no autoscaling.mcp block): the SDK's
# StreamableHTTPHandler keeps in-memory, per-process MCP session state and
# the mcp Service has no session affinity, so a second replica could receive
# a mid-session request its own process never created.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Kong exposure of the MCP server (mcp-route.yaml): host path
  # /api/mcp/<context> rewritten to /mcp. Off by default; warehouse-infra
  # turns it on with the real parentRefs and path.
  route:
    enabled: false
    path: "/api/mcp/slotting-optimization"
    parentRefs:
      - name: ""
        namespace: ""
        sectionName: "http"
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# --- Analytics read side (docs/adr/0006) ---
# The slot-plan funnel data product: the projector (cmd/slotting-projector,
# the ONLY writer of the analytical database, consuming the analytics topic
# warehouse.slotting-optimization.analytics) and the read-only reports binary
# (cmd/slotting-reports, GET /reports/slot-plan-funnel and
# /reports/freshness). DISABLED by default: the default render is unchanged.
#
# Enabling it renders the projector Deployment (component
# analytics-projector, /healthz + /readyz on :8091, no Service) and the
# reports Deployment + Service <fullname>-reports:80 (component
# analytics-reports, :8092), plus a Secret with ANALYTICS_DATABASE_URL when
# analytics.url is set. The chart refuses to render analytics without a DSN
# source (analytics.url or analytics.existingSecret) or without
# kafka.enabled=true: the binaries exit at boot otherwise (crash-loop).
#
# Deliberately NOT HPA-scalable (no autoscaling blocks): the projector keeps
# per-process consumer/offset state and a second replica would double-derive
# nothing (one group, one partition owner) while the reports Service has no
# session affinity -- replica counts are fixed values.
analytics:
  enabled: false
  # The analytical database is SEPARATE from database.* (OLTP): the
  # projector has no credentials on OLTP data and the reports pool is
  # read-only. Direct DSN (no PgBouncer) -- the projector runs the embedded
  # analytical migrations through it.
  url: ""
  existingSecret: ""
  existingSecretKey: "ANALYTICS_DATABASE_URL"
  # The projector's STABLE consumer group (the binary's default is the same
  # value; the chart always sets it): a rescheduled pod resumes from its
  # committed offsets, and a brand-new group replays from the earliest
  # retained offset (the backfill).
  consumerGroup: "slotting-optimization-analytics"
  projector:
    replicaCount: 1
    # ADMIN_ADDR (/healthz and /readyz) and its container port.
    adminAddr: ":8091"
    adminPort: 8091
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    extraEnv: []
  reports:
    replicaCount: 1
    httpAddr: ":8092"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    extraEnv: []

# --- frontend (Module Federation REMOTE `slotting_mfe`) ---
# The operator SPA remote, built from web/ and served by its own
# nginx-unprivileged pod (component=frontend). In the kind cluster it is
# reached through warehouse-infra's Nginx web gateway at
# http://localhost/mfes/slotting-optimization/ -- never through Kong, which
# serves APIs only. The remote reads its API origin at runtime from the
# console's /config.json (`${apiOrigin}/api/slotting-optimization`), so
# nothing about it is configured here. No ingress/httproute for it and the
# Service stays ClusterIP: frontend path routing is owned by the Nginx web
# gateway.
#
# Disabled by default so existing releases are unaffected; warehouse-infra
# sets frontend.enabled=true and supplies the locally built image tag (image
# built from web/; side-loaded into kind, so keep pullPolicy IfNotPresent).
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/slotting-optimization-frontend
    pullPolicy: IfNotPresent
    # Empty = the chart's appVersion. warehouse-infra overrides it.
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
