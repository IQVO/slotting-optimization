{{- include "slotting-optimization.requireRealRuntime" . -}}
{{- include "slotting-optimization.requireLookbackDays" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slotting-optimization.fullname" . }}
  labels:
    {{- include "slotting-optimization.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "slotting-optimization.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "slotting-optimization.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "slotting-optimization.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "slotting-optimization.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # D14 pattern (2026-10-12): every config.* value (OUTBOX_RELAY_INTERVAL,
          # OUTBOX_MAX_ATTEMPTS, SHUTDOWN_DRAIN_DELAY, ...) also reaches cmd/api
          # through the chart ConfigMap. The explicit `env` entries below win
          # over envFrom for the same key and carry the same values, so nothing
          # changes for the variables already set here; the checksum/config
          # annotation above rolls the pods when the ConfigMap changes. Only
          # this Deployment mounts it: cmd/mcp reads its own explicit env.
          # tests/render_test.sh asserts the mount and that every variable the
          # binaries read is rendered.
          envFrom:
            - configMapRef:
                name: {{ include "slotting-optimization.fullname" . }}
          # Env contract verified against cmd/api/main.go's header comment.
          # Values that have a dedicated chart key are rendered here, never
          # through extraEnv, so the same variable is never set twice.
          env:
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: EVENT_PUBLISHER
              value: {{ .Values.config.eventPublisher | quote }}
            {{- with .Values.config.outboxRelayInterval }}
            - name: OUTBOX_RELAY_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            # D12 / ADR 0008: the relay excludes a row after this many
            # failures (0 = unlimited).
            - name: OUTBOX_MAX_ATTEMPTS
              value: {{ .Values.config.outboxMaxAttempts | quote }}
            # Planning defaults (ADR 0002): the site plans default to (and,
            # as DEMAND_SITE_ID, the only site whose demand is ingested),
            # the default demand window and the forward-slot zone codes.
            # Absent while empty so the binary's own defaults apply.
            {{- with .Values.config.demandSiteId }}
            - name: DEMAND_SITE_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.defaultSiteId }}
            - name: DEFAULT_SITE_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.lookbackDays }}
            - name: LOOKBACK_DAYS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.forwardZoneCodes }}
            - name: FORWARD_ZONE_CODES
              value: {{ . | quote }}
            {{- end }}
            # ADR 0003 / ADR 0010 / ADR 0011 local copies: the four consumers
            # always run (the only mode is "kafka"). The consumer group ids
            # come from values, never a literal, and are mandatory (the chart
            # refuses an empty one): a stable id is what makes a rescheduled
            # pod resume from its committed offsets.
            - name: DEMAND_MODE
              value: {{ .Values.config.demandMode | quote }}
            - name: DEMAND_CONSUMER_GROUP
              value: {{ .Values.config.demandConsumerGroup | quote }}
            - name: PRODUCT_MODE
              value: {{ .Values.config.productMode | quote }}
            - name: PRODUCT_CONSUMER_GROUP
              value: {{ .Values.config.productConsumerGroup | quote }}
            - name: LAYOUT_MODE
              value: {{ .Values.config.layoutMode | quote }}
            - name: LAYOUT_CONSUMER_GROUP
              value: {{ .Values.config.layoutConsumerGroup | quote }}
            # ADR 0010: inventory-storage's StockRelocated -> slot-plan
            # execution progress (warehouse.inventory.events).
            - name: RELOCATION_MODE
              value: {{ .Values.config.relocationMode | quote }}
            - name: RELOCATION_CONSUMER_GROUP
              value: {{ .Values.config.relocationConsumerGroup | quote }}
            {{- with .Values.config.shutdownDrainDelay }}
            - name: SHUTDOWN_DRAIN_DELAY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.corsAllowedOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "slotting-optimization.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment:
            # a direct (non-pooled) connection used only for the
            # golang-migrate step, never for the runtime pgxpool.
            # `optional: true` so a secret without this key still starts the
            # pod -- the binary falls back to DATABASE_URL.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "slotting-optimization.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            # Mandatory (ADR 0011): the relay, the four consumers and /readyz
            # all dial Kafka; the chart refuses to render without the brokers.
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
