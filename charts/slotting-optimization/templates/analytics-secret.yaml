{{- if and .Values.analytics.enabled .Values.analytics.url (not .Values.analytics.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slotting-optimization.analyticsSecretName" . }}
  labels:
    {{- include "slotting-optimization.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.analytics.existingSecretKey }}: {{ .Values.analytics.url | quote }}
{{- end }}
