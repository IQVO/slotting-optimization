openapi: 3.0.3
info:
  title: Slotting Optimization API
  version: 1.0.0
  description: |
    The WMS-tier planner of forward pick slots in the warehouse-systems platform
    (ADR 0001, ADR 0002). It proposes which SKUs get a forward pick slot and
    which slot, as a reviewable **slot plan**, and records the human decision on
    it. Policy `abc-velocity-v1`: rank SKUs by order-line picks over a lookback
    window, class them A/B/C, and assign eligible forward slots with stickiness
    (a SKU that still fits its current slot keeps it).

    A plan is created as a `Draft`. Only `approve` makes it the site's forward
    slot map (at most one `Approved` plan per site; approving a new one
    supersedes the previous one in the same transaction). Approval publishes
    `SlotPlanApproved` with the full assignment map and the moves; nothing moves
    stock (execution of the moves is a planned, unbuilt edge, ADR 0002).

    Plans are computed from local copies fed by events (ADR 0003); this API never
    calls a sibling context. Events are published as CloudEvents on
    `warehouse.slotting-optimization.events` through a transactional outbox (see
    `apis/asyncapi.yaml`).

    Errors are RFC 7807 problem documents with
    `type = https://errors.slotting-optimization.warehouse-systems.dev/<slug>`.
    There is no authentication layer (fleet decision 2026-09-11).
  contact:
    name: slotting-optimization maintainers
    url: https://github.com/IQVO/slotting-optimization
  license:
    name: UNLICENSED
servers:
  - url: http://localhost:8080
    description: Local development
  - url: http://localhost:8000/api/slotting-optimization
    description: Local kind cluster through Kong
tags:
  - name: Slot plans
    description: Generate, review, approve and reject slot plans.
  - name: Forward slots
    description: The current approved forward-slot assignment map.
  - name: Velocity
    description: The demand velocity the planner works from.
  - name: Health
    description: Liveness and readiness probes.

paths:
  /slot-plans:
    post:
      operationId: generateSlotPlan
      summary: Generate a slot plan
      description: |
        Computes a new `Draft` plan for a site from the local demand, product and
        layout copies and stores it. `siteId` defaults to the configured default
        site; `lookbackDays` (1 to 365, default 28) sets the demand window, which
        ends now and starts `lookbackDays` earlier. The plan lists its
        assignments, the moves against the site's current Approved plan and the
        SKUs it could not place, each with a reason. Requires an
        `Idempotency-Key`; replaying the same key and body returns the original
        plan.
      tags: [Slot plans]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSlotPlanRequest"
            example:
              siteId: SITE-1
              lookbackDays: 28
      responses:
        "201":
          description: The Draft plan was generated.
          headers:
            Location:
              description: Path of the new plan.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotPlan"
              example:
                planId: plan-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07
                siteId: SITE-1
                state: Draft
                policy: abc-velocity-v1
                windowFrom: "2026-09-10T12:00:00Z"
                windowTo: "2026-10-08T12:00:00Z"
                generatedAt: "2026-10-08T12:00:00Z"
                version: 1
                assignments:
                  - { sku: SKU-1, slot: WH1-FWD-A01-01-01-A, abcClass: A, picks: 80, units: 160 }
                  - { sku: SKU-2, slot: WH1-FWD-A01-01-02-A, abcClass: B, picks: 20, units: 40 }
                moves:
                  - { sku: SKU-1, toSlot: WH1-FWD-A01-01-01-A, kind: Assign }
                  - { sku: SKU-2, fromSlot: WH1-FWD-A02-03-01-A, toSlot: WH1-FWD-A01-01-02-A, kind: Relocate }
                  - { sku: SKU-3, fromSlot: WH1-FWD-A01-01-03-A, kind: Vacate }
                unassigned:
                  - { sku: SKU-4, reason: NoPhysicalProfile }
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listSlotPlans
      summary: List slot plans
      description: |
        Lists plans newest first, a page at a time. `cursor` is the opaque
        `nextCursor` of the previous page; a response without `nextCursor` is the
        last page. Optional filters narrow by site and state.
      tags: [Slot plans]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: siteId
          in: query
          description: Only plans of this site.
          schema:
            type: string
        - name: state
          in: query
          description: Only plans in this state.
          schema:
            $ref: "#/components/schemas/PlanState"
      responses:
        "200":
          description: One page of plan summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotPlanPage"
              example:
                items:
                  - planId: plan-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07
                    siteId: SITE-1
                    state: Approved
                    policy: abc-velocity-v1
                    windowFrom: "2026-09-10T12:00:00Z"
                    windowTo: "2026-10-08T12:00:00Z"
                    generatedAt: "2026-10-08T12:00:00Z"
                    approvedAt: "2026-10-08T12:30:00Z"
                    assignmentCount: 2
                    moveCount: 3
                    unassignedCount: 1
                    version: 2
                nextCursor: cGxhbi0z
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /slot-plans/{planId}:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      operationId: getSlotPlan
      summary: Get a slot plan
      description: "Returns the full plan, with its assignments, moves, unassigned SKUs and reasons, state and timestamps."
      tags: [Slot plans]
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/PlanNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /slot-plans/{planId}/approve:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: approveSlotPlan
      summary: Approve a Draft plan
      description: |
        Moves a `Draft` plan to `Approved` and publishes `SlotPlanApproved` with
        the full assignment map and the moves. The site's previously Approved
        plan, if any, becomes `Superseded` in the same transaction. Approving a
        plan that is not a `Draft` is a 409 `plan-not-draft`; losing a race to
        another approval of the same site is a 409 `approved-plan-conflict`.
      tags: [Slot plans]
      responses:
        "200":
          description: The plan is now Approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/PlanNotFound"
        "409":
          $ref: "#/components/responses/PlanConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /slot-plans/{planId}/reject:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    post:
      operationId: rejectSlotPlan
      summary: Reject a Draft plan
      description: |
        Moves a `Draft` plan to `Rejected` and publishes `SlotPlanRejected`. The
        optional `reason` is at most 500 characters. Rejecting a plan that is not
        a `Draft` is a 409 `plan-not-draft`.
      tags: [Slot plans]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectSlotPlanRequest"
            example:
              reason: Too many relocations before peak season.
      responses:
        "200":
          description: The plan is now Rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/PlanNotFound"
        "409":
          $ref: "#/components/responses/PlanConflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /forward-slots:
    get:
      operationId: listForwardSlots
      summary: The current approved forward-slot map
      description: |
        The assignment map of the site's currently Approved plan, in SKU order.
        Returns an empty `assignments` list and no `planId` while the site has no
        Approved plan.
      tags: [Forward slots]
      parameters:
        - name: siteId
          in: query
          description: The site; defaults to the configured default site.
          schema:
            type: string
      responses:
        "200":
          description: The forward-slot map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForwardSlots"
              example:
                siteId: SITE-1
                planId: plan-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07
                approvedAt: "2026-10-08T12:30:00Z"
                assignments:
                  - { sku: SKU-1, slot: WH1-FWD-A01-01-01-A, abcClass: A }
                  - { sku: SKU-2, slot: WH1-FWD-A01-01-02-A, abcClass: B }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /sku-velocity:
    get:
      operationId: listSkuVelocity
      summary: SKU velocity over a window
      description: |
        The demand the planner works from: per SKU, the number of ACTIVE demand
        lines (`picks`) and their units over the last `windowDays` days, ordered
        by picks, then units (descending) and SKU (ascending). Read from the
        local demand copy (ADR 0003).
      tags: [Velocity]
      parameters:
        - name: limit
          in: query
          description: Number of SKUs to return, 1 to 500 (default 100).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 100
        - name: windowDays
          in: query
          description: Lookback window in days, 1 to 365 (default 28).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 365
            default: 28
        - name: siteId
          in: query
          description: The site; defaults to the configured default site.
          schema:
            type: string
      responses:
        "200":
          description: The velocity list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkuVelocityList"
              example:
                siteId: SITE-1
                windowFrom: "2026-09-10T12:00:00Z"
                windowTo: "2026-10-08T12:00:00Z"
                items:
                  - { sku: SKU-1, picks: 80, units: 160 }
                  - { sku: SKU-2, picks: 20, units: 40 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      description: 200 while the process is running.
      tags: [Health]
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      description: 200 when the service can serve traffic; 503 while starting or draining for shutdown.
      tags: [Health]
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

components:
  parameters:
    PlanId:
      name: planId
      in: path
      required: true
      description: The plan id (`plan-` followed by a unique suffix, at most 64 characters).
      schema:
        type: string
        minLength: 6
        maxLength: 64
        pattern: "^plan-[^\\s/]+$"
      example: plan-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07
    Limit:
      name: limit
      in: query
      description: Page size, 1 to 500 (default 100).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 100
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` value from the previous page.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Caller-generated unique key (a UUID per logical submit) that makes a
        retried request safe. Required whenever the service runs with Postgres,
        that is in every deployment, and answered with 400
        `idempotency-key-required` when absent; a replay with the same key and
        the same body returns the original response, while the same key with a
        different body is 422 `idempotency-key-reused`. The in-memory development
        mode (no `DATABASE_URL`) does not enforce it, which is why the header is
        not marked `required` here.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    BadRequest:
      description: Malformed JSON body, an unknown field, or an invalid path or query parameter.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            malformedBody:
              summary: Malformed JSON body or unknown field
              value:
                type: https://errors.slotting-optimization.warehouse-systems.dev/malformed-request
                title: Malformed request
                status: 400
                detail: request body is not valid JSON for this operation
                instance: /slot-plans
            invalidLookback:
              summary: lookbackDays out of range
              value:
                type: https://errors.slotting-optimization.warehouse-systems.dev/invalid-lookback
                title: Lookback is invalid
                status: 400
                detail: lookbackDays must be between 1 and 365
                instance: /slot-plans
            invalidSite:
              summary: Invalid site id
              value:
                type: https://errors.slotting-optimization.warehouse-systems.dev/invalid-site-id
                title: Site id is invalid
                status: 400
                detail: "siteId must be 1..64 characters without whitespace, control characters or '/'"
                instance: /slot-plans
            invalidPlanId:
              summary: Invalid plan id
              value:
                type: https://errors.slotting-optimization.warehouse-systems.dev/invalid-plan-id
                title: Plan id is invalid
                status: 400
                detail: "plan id must start with plan- and have no whitespace, control characters or '/'"
                instance: /slot-plans/nope
            invalidReason:
              summary: Reject reason too long
              value:
                type: https://errors.slotting-optimization.warehouse-systems.dev/reject-reason-too-long
                title: Reject reason is too long
                status: 400
                detail: reason must be at most 500 characters
                instance: /slot-plans/plan-1/reject
            invalidCursor:
              summary: Invalid cursor
              value:
                type: https://errors.slotting-optimization.warehouse-systems.dev/invalid-cursor
                title: Cursor is invalid
                status: 400
                detail: cursor is not a value returned by this API
                instance: /slot-plans
            invalidLimit:
              summary: Invalid limit or window
              value:
                type: https://errors.slotting-optimization.warehouse-systems.dev/invalid-limit
                title: Limit is invalid
                status: 400
                detail: limit must be between 1 and 500
                instance: /sku-velocity
            invalidState:
              summary: Unknown plan state filter
              value:
                type: https://errors.slotting-optimization.warehouse-systems.dev/invalid-state
                title: State is invalid
                status: 400
                detail: "state must be one of Draft, Approved, Rejected, Superseded"
                instance: /slot-plans
            idempotencyKeyRequired:
              summary: Missing Idempotency-Key
              value:
                type: https://errors.slotting-optimization.warehouse-systems.dev/idempotency-key-required
                title: Idempotency-Key header is required
                status: 400
                detail: send an Idempotency-Key header with a unique value per logical request
                instance: /slot-plans
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used with a different request body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://errors.slotting-optimization.warehouse-systems.dev/idempotency-key-reused
            title: Idempotency-Key was already used with a different request
            status: 422
            detail: the Idempotency-Key was used with a different request body
            instance: /slot-plans
    PlanNotFound:
      description: No plan has this id.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://errors.slotting-optimization.warehouse-systems.dev/plan-not-found
            title: Slot plan not found
            status: 404
            detail: slot plan not found
            instance: /slot-plans/plan-unknown
    PlanConflict:
      description: The plan is not a Draft, or another request changed the plan or the site's approval first.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            planNotDraft:
              summary: Only a Draft plan can be approved or rejected
              value:
                type: https://errors.slotting-optimization.warehouse-systems.dev/plan-not-draft
                title: Only a Draft plan can be approved or rejected
                status: 409
                detail: slot plan is not a Draft
                instance: /slot-plans/plan-1/approve
            approvedPlanConflict:
              summary: Another plan of the site was approved first
              value:
                type: https://errors.slotting-optimization.warehouse-systems.dev/approved-plan-conflict
                title: Another plan of this site was approved at the same time
                status: 409
                detail: the site already has a newer Approved plan; re-fetch and retry
                instance: /slot-plans/plan-1/approve
            concurrentModification:
              summary: Concurrent write
              value:
                type: https://errors.slotting-optimization.warehouse-systems.dev/concurrent-modification
                title: The resource was modified by another request; re-fetch the latest version and retry
                status: 409
                detail: concurrent modification
                instance: /slot-plans/plan-1/approve
    InternalError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://errors.slotting-optimization.warehouse-systems.dev/internal-error
            title: Internal server error
            status: 500
            detail: an unexpected error occurred
            instance: /slot-plans

  schemas:
    PlanState:
      type: string
      description: Lifecycle state of a plan.
      enum: [Draft, Approved, Rejected, Superseded]
    AbcClass:
      type: string
      description: Velocity class by cumulative pick share (A up to 80 %, B up to 95 %, else C).
      enum: [A, B, C]
    MoveKind:
      type: string
      enum: [Assign, Relocate, Vacate]
    UnassignedReason:
      type: string
      description: |
        `NoPhysicalProfile`: the SKU has no effective dimensions. `NoCapacityFit`:
        compatible slots exist but none holds one unit. `NoEligibleSlot`: no
        compatible slot exists, or every eligible slot went to a higher-ranked SKU.
      enum: [NoEligibleSlot, NoPhysicalProfile, NoCapacityFit]

    GenerateSlotPlanRequest:
      type: object
      additionalProperties: false
      properties:
        siteId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[^\\s/]+$"
          description: The site to plan; defaults to the configured default site.
        lookbackDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          default: 28
          description: Length of the demand window ending now, in days.
    RejectSlotPlanRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
          description: Why the plan was rejected; optional.

    Assignment:
      type: object
      required: [sku, slot, abcClass, picks, units]
      properties:
        sku: { type: string, example: SKU-1 }
        slot: { type: string, description: The facility-layout location code of the forward slot, example: WH1-FWD-A01-01-01-A }
        abcClass: { $ref: "#/components/schemas/AbcClass" }
        picks: { type: integer, format: int64, minimum: 1, description: ACTIVE demand lines in the window }
        units: { type: integer, format: int64, minimum: 0, description: Units on those lines }
    Move:
      type: object
      required: [sku, kind]
      properties:
        sku: { type: string }
        fromSlot: { type: string, description: Omitted for an Assign }
        toSlot: { type: string, description: Omitted for a Vacate }
        kind: { $ref: "#/components/schemas/MoveKind" }
    Unassigned:
      type: object
      required: [sku, reason]
      properties:
        sku: { type: string }
        reason: { $ref: "#/components/schemas/UnassignedReason" }
    SlotPlan:
      type: object
      required: [planId, siteId, state, policy, windowFrom, windowTo, generatedAt, version, assignments, moves, unassigned]
      properties:
        planId: { type: string, example: plan-3b0e8d2a-7c41-4f6a-9d15-2a8b6c4e1f07 }
        siteId: { type: string }
        state: { $ref: "#/components/schemas/PlanState" }
        policy: { type: string, example: abc-velocity-v1 }
        windowFrom: { type: string, format: date-time }
        windowTo: { type: string, format: date-time, description: Exclusive }
        generatedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        rejectedAt: { type: string, format: date-time }
        supersededAt: { type: string, format: date-time }
        rejectReason: { type: string }
        supersedesPlanId: { type: string, description: The plan this one replaced when it was approved }
        version: { type: integer, format: int64, description: "Starts at 1, +1 per accepted transition." }
        assignments:
          type: array
          description: In SKU order.
          items: { $ref: "#/components/schemas/Assignment" }
        moves:
          type: array
          description: In SKU order.
          items: { $ref: "#/components/schemas/Move" }
        unassigned:
          type: array
          description: In SKU order.
          items: { $ref: "#/components/schemas/Unassigned" }
    SlotPlanSummary:
      type: object
      required: [planId, siteId, state, policy, windowFrom, windowTo, generatedAt, assignmentCount, moveCount, unassignedCount, version]
      properties:
        planId: { type: string }
        siteId: { type: string }
        state: { $ref: "#/components/schemas/PlanState" }
        policy: { type: string }
        windowFrom: { type: string, format: date-time }
        windowTo: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        assignmentCount: { type: integer, format: int32, minimum: 0 }
        moveCount: { type: integer, format: int32, minimum: 0 }
        unassignedCount: { type: integer, format: int32, minimum: 0 }
        version: { type: integer, format: int64 }
    SlotPlanPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SlotPlanSummary" }
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.
    ForwardSlot:
      type: object
      required: [sku, slot, abcClass]
      properties:
        sku: { type: string }
        slot: { type: string }
        abcClass: { $ref: "#/components/schemas/AbcClass" }
    ForwardSlots:
      type: object
      required: [siteId, assignments]
      properties:
        siteId: { type: string }
        planId: { type: string, description: The Approved plan the map comes from; absent when the site has none }
        approvedAt: { type: string, format: date-time }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/ForwardSlot" }
    SkuVelocity:
      type: object
      required: [sku, picks, units]
      properties:
        sku: { type: string }
        picks: { type: integer, format: int64, minimum: 1 }
        units: { type: integer, format: int64, minimum: 0 }
    SkuVelocityList:
      type: object
      required: [siteId, windowFrom, windowTo, items]
      properties:
        siteId: { type: string }
        windowFrom: { type: string, format: date-time }
        windowTo: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/SkuVelocity" }
    Problem:
      type: object
      description: RFC 7807 problem document used for every non-2xx response.
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string }
        instance: { type: string }
    Status:
      type: object
